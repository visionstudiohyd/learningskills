name: Deploy to cPanel

# Rebuild the live site after every push to main.
#
# The cPanel host cannot compile this app: the account runs with a 1 GB soft /
# 2 GB hard virtual-memory cap, which crashes the WASM SWC fallback that Next
# needs because the host's glibc is too old for the native SWC binary. So the
# build runs here on GitHub's runners and only the compiled output is uploaded
# over FTP; the server just restarts (tmp/restart.txt is touched).
#
# ---------------------------------------------------------------------------
# The build MUST use webpack, never Turbopack - which is what a plain
# `next build` selects by default on Next 16.
#
# A Turbopack production build emits the server-external packages (mysql2,
# bcryptjs - see serverExternalPackages in next.config.mjs) as *absolute
# symlinks* under .next/node_modules pointing into the build machine's own
# node_modules, and references them by a content-hashed alias:
#
#   .next/node_modules/mysql2-3d80281e5ed34ca6 -> /<builder>/node_modules/mysql2
#
# Nothing about that survives the trip: the path does not exist on the cPanel
# host, and FTP has no command to create a symlink, so lftp silently leaves it
# behind. Every database-backed page and route then dies at module evaluation:
#
#   Cannot find module 'mysql2-3d80281e5ed34ca6/promise'
#
# Because that throws before any route's own try/catch can run, it surfaces as
# a bare HTTP 500 with an empty body, while the public pages quietly fall back
# to their built-in default copy. The symptom looks exactly like "the database
# is not connected" even though the credentials are perfectly fine - which is
# precisely how this bit the site once already.
#
# The webpack build instead requires "mysql2/promise" by its real name and
# resolves it from the server's own node_modules, so the output is portable.
# The "Verify the build is portable" step below enforces that, so a Turbopack
# build can never reach the server again.
# ---------------------------------------------------------------------------
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_HOST  ftp.ilearningskills.com
#   FTP_USER  an FTP account that can write the application root
#   FTP_PASS  that account's password
#
# Optional but recommended - DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD:
# with these the ISR pages are prerendered from real content. Without them the
# build still succeeds (the query layer falls back to defaults) and each page
# fills in on the server the first time it is requested after its revalidate
# window - 60s for the homepage, 300s elsewhere. Reaching the database from
# here needs cPanel -> Remote MySQL to allow the connection.
#
# Optional repository variable FTP_APP_DIR - the application root relative to
# where FTP_USER logs in. Normally unnecessary: the "Locate the application
# root" step probes for server.js and handles both common layouts (an FTP
# account rooted at the app, or the main cPanel account landing one level up).
#
# Dependency changes still need a one-off `npm install` on the server, because
# only the build output is uploaded. See DEPLOYMENT.md -> "Automatic redeploys".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_APP_DIR: ${{ vars.FTP_APP_DIR }}
      SITE_URL: https://www.ilearningskills.com

    steps:
      - name: Check secrets
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Set the FTP_HOST, FTP_USER and FTP_PASS repository secrets (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # NEXT_PUBLIC_* values are inlined into the bundle at build time, so
          # they have to be set here. The server's .env.production is only read
          # at runtime, which is why an earlier build shipped with
          # og:url = http://localhost:3000 in its metadata.
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          # Optional; see the header. Empty values simply mean the prerendered
          # pages start on default copy and refresh themselves on the server.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MEDIA_DRIVER: local
        run: npm run build -- --webpack

      - name: Verify the build is portable
        run: |
          fail=0

          # Turbopack's externals shim. Its absolute symlinks cannot resolve on
          # the host, and this is exactly what broke the database connection.
          if [ -d .next/node_modules ]; then
            echo "::error::.next/node_modules exists, so this is a Turbopack build. Its externals are absolute symlinks into this runner's node_modules and cannot resolve on the cPanel host. Build with --webpack."
            ls -la .next/node_modules || true
            fail=1
          fi

          # Any symlink at all would be dropped in transit, because FTP has no
          # command to create one.
          if [ -n "$(find .next -type l -print -quit)" ]; then
            echo "::error::.next contains symlinks, which FTP cannot transfer:"
            find .next -type l -printf '  %p -> %l\n'
            fail=1
          fi

          # The real module name has to survive into the server bundle.
          if ! grep -rqF 'require("mysql2/promise")' .next/server; then
            echo "::error::No plain require(\"mysql2/promise\") in .next/server - the database driver is not externalised the way the host needs."
            fail=1
          fi

          exit $fail

      - name: Locate the application root
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          cat > probe.lftp <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:ssl-protect-data yes
          set net:max-retries 2
          set net:timeout 20
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          cd "@CANDIDATE@"
          cls -1 server.js
          bye
          EOF

          # Either the FTP account logs in at the application root, or it lands
          # in the cPanel home directory and the app sits one level down. Probe
          # for the Passenger startup file instead of guessing, so a changed
          # FTP account cannot silently publish the build into the wrong place.
          found=""
          for candidate in "$FTP_APP_DIR" "." "ilearningskills_app"; do
            [ -n "$candidate" ] || continue
            sed "s|@CANDIDATE@|$candidate|" probe.lftp > probe.run
            if lftp -f probe.run >/dev/null 2>&1; then
              found="$candidate"
              break
            fi
            echo "no server.js in: $candidate"
          done
          rm -f probe.lftp probe.run

          if [ -z "$found" ]; then
            echo "::error::Could not find server.js where FTP_USER logs in, or in ./ilearningskills_app. Set the FTP_APP_DIR repository variable to the application root, relative to the FTP login directory."
            exit 1
          fi

          echo "application root: $found"
          echo "APP_DIR=$found" >> "$GITHUB_ENV"

      - name: Upload the build over FTP
        run: |
          printf '%s\n' "$GITHUB_SHA" > restart.txt

          # Settings shared by every lftp invocation below. The host's FTP
          # certificate does not match the hostname, so verification is off;
          # the traffic is still TLS-protected.
          #
          # parallel=2 is deliberate. The first attempts at this used 4 and the
          # session died ~11 minutes in, twice; shared FTP hosts commonly cap
          # concurrent connections per account, and the payload is only ~24 MB
          # spread over many small files, so the extra streams buy little.
          cat > lftp.rc <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:ssl-protect-data yes
          set net:max-retries 5
          set net:timeout 30
          set net:reconnect-interval-base 5
          set cmd:fail-exit yes
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          cd "$APP_DIR"
          EOF

          # The upload runs as three separate lftp sessions rather than one, so
          # that a failure in the optional middle phase cannot skip the restart
          # at the end. That is not hypothetical: a deploy once uploaded a
          # perfect build, hit an error on the public/ mirror, and exited before
          # writing tmp/restart.txt - so the host went on serving the old broken
          # build while the fixed one sat on disk, unused and invisible.

          # 1. The build. The only payload that matters, so this phase is the
          #    one allowed to stop the deploy - but only after retrying, since
          #    the failures seen here were dropped sessions rather than bad
          #    files. --continue resumes a partial transfer instead of starting
          #    the whole mirror again.
          #
          #    --delete prunes the previous build's content-hashed chunks, which
          #    would otherwise pile up against the account quota, and removes a
          #    Turbopack externals shim left behind by an older deploy.
          #
          #    The excludes are all dead weight for this deployment style:
          #    cache/ is the local webpack/ISR cache, types/ is TypeScript
          #    definitions, trace and diagnostics are build telemetry, and the
          #    .nft.json file-tracing manifests are only read when building a
          #    standalone bundle, which this is not.
          cat lftp.rc > step.lftp
          cat >> step.lftp <<'EOF'
          set cmd:fail-exit no
          rm -rf .next/node_modules
          set cmd:fail-exit yes
          mirror --reverse --delete --verbose --parallel=2 --continue --exclude '^cache/' --exclude '^types/' --exclude '^trace$' --exclude '^trace-build$' --exclude '^diagnostics/' --exclude '\.nft\.json$' .next .next
          bye
          EOF

          uploaded=0
          for attempt in 1 2 3; do
            if lftp -f step.lftp; then
              uploaded=1
              break
            fi
            echo "::warning::.next mirror attempt ${attempt} did not complete; retrying (--continue resumes where it stopped)."
          done

          if [ "$uploaded" != "1" ]; then
            echo "::error::Could not upload .next after 3 attempts. The host dropped the FTP session each time. Nothing was restarted, so the previous build is still serving."
            exit 1
          fi

          # 2. Files the server reads from disk on every boot but which rarely
          #    change: public/ static assets, next.config.mjs (read by the Next
          #    server), server.js (the Passenger entry point) and package.json
          #    (for its "type": "module"). Best-effort on purpose - see above.
          #    The verification steps at the end still decide the run outcome,
          #    so a genuinely broken deploy cannot pass because of this.
          #
          #    No --delete on public, and uploads/ is excluded outright, so the
          #    media uploaded through the admin is never touched by a deploy.
          cat lftp.rc > step.lftp
          cat >> step.lftp <<'EOF'
          mirror --reverse --verbose --parallel=2 --continue --exclude '^uploads/' public public
          put next.config.mjs -o next.config.mjs
          put server.js -o server.js
          put package.json -o package.json
          put package-lock.json -o package-lock.json
          bye
          EOF
          if ! lftp -f step.lftp; then
            echo "::warning::Could not sync public/ and the root config files. The build itself uploaded fine, so the deploy continues to the restart. Re-check this if a new static asset or a next.config.mjs / server.js change has not taken effect."
          fi

          # 3. Activate the new build. Passenger restarts when tmp/restart.txt
          #    changes mtime, and the contents record which commit is live.
          #    The mkdir is deliberate: tmp/ is easy to lose (a File Manager
          #    cleanup removes it), and without it the put fails and the new
          #    build never gets activated at all.
          cat lftp.rc > step.lftp
          cat >> step.lftp <<'EOF'
          set cmd:fail-exit no
          mkdir -p tmp
          set cmd:fail-exit yes
          put restart.txt -o tmp/restart.txt
          bye
          EOF
          lftp -f step.lftp

          rm -f lftp.rc step.lftp

      - name: Wait for the site to come back
        run: |
          for attempt in $(seq 1 20); do
            sleep 15
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/" || true)
            echo "attempt ${attempt}: HTTP ${code:-none}"
            if [ "$code" = "200" ]; then
              echo "$SITE_URL is serving the new build."
              exit 0
            fi
          done

          echo "::error::$SITE_URL did not return HTTP 200 within 5 minutes. Check stderr.log in the application root on the server."
          exit 1

      - name: Verify the database is reachable from the new build
        run: |
          # Guards against shipping a build that boots but cannot load the MySQL
          # driver - the failure this pipeline previously had, which left the
          # site up and serving default copy, so the deploy still looked green.
          for attempt in $(seq 1 8); do
            body=$(curl -sS --max-time 30 "$SITE_URL/api/test-db" || true)
            case "$body" in
              *'"success":true'*)
                echo "Database reachable from the deployed build."
                exit 0
                ;;
            esac
            echo "attempt ${attempt}: ${body:-<empty response>}"
            sleep 10
          done

          echo "::error::The deployed build cannot reach MySQL. An empty 500 body means the driver failed to load; a JSON error code means the host or credentials in the server's .env.production need checking."
          exit 1
