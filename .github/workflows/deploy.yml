name: Deploy to cPanel

# Rebuild the live site after every push to main.
#
# The cPanel host cannot compile this app: the account runs with a 1 GB soft /
# 2 GB hard virtual-memory cap, which crashes the WASM SWC fallback that Next
# needs because the host's glibc is too old for the native SWC binary. So the
# build runs here on GitHub's runners and only the compiled `.next` bundle is
# uploaded over FTP; the server just restarts (tmp/restart.txt is touched).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST  ftp.ilearningskills.com
#   FTP_USER  the FTP account whose home directory is the app root
#   FTP_PASS  that account's password
#
# Dependency changes still need a one-off `npm install` on the server, because
# only the build output is uploaded. See DEPLOYMENT.md → "Automatic redeploys".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      SITE_URL: https://www.ilearningskills.com

    steps:
      - name: Check secrets
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Set the FTP_HOST, FTP_USER and FTP_PASS repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload the build over FTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # The host's FTP certificate does not match the hostname, so verify is
          # off; traffic is still TLS-protected.
          printf '%s\n' "$GITHUB_SHA" > restart.txt
          cat > deploy.lftp <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:ssl-protect-data yes
          set net:max-retries 3
          set net:timeout 30
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mirror --reverse --delete --verbose --exclude-glob cache --parallel=4 .next .next
          put restart.txt -o tmp/restart.txt
          bye
          EOF

          lftp -f deploy.lftp

      - name: Wait for the site to come back
        run: |
          for attempt in $(seq 1 20); do
            sleep 15
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/" || true)
            echo "attempt ${attempt}: HTTP ${code:-none}"
            if [ "$code" = "200" ]; then
              echo "Deployment finished — $SITE_URL is serving the new build."
              exit 0
            fi
          done

          echo "::error::$SITE_URL did not return HTTP 200 within 5 minutes. Check the app's stderr.log on the server."
          exit 1
